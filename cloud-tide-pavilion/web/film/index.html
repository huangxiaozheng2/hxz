  let lo = 0, hi = tb.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tb[m].s < s) lo = m; else hi = m; }
  const A = tb[lo], B = tb[hi], f = B.s > A.s ? (s - A.s) / (B.s - A.s) : 0;
  let i = A.i, uu = lerp(A.u, B.i === A.i ? B.u : 1, f);
  if (B.i !== A.i) { i = B.i; uu = lerp(0, B.u, f); }
  if (path.L < 1e-6) { i = 0; uu = 0; }
  const n = path.P.length - 1;
  i = Math.min(i, Math.max(0, n - 1));
  const pos = n ? crPoint(path.P, i, uu) : path.P[0].clone();
  const tgt = n ? crPoint(path.T, i, uu) : path.T[0].clone();
  const h = n ? lerp(path.hf[i], path.hf[i + 1], smooth(uu)) : path.hf[0];
  return { pos, tgt, h };
}

// =====================================================================================
// 逐帧
// =====================================================================================
// 每张渲染图各占一层，载入时就解码好：渲染时不再切换图片，第一帧也不会空着
for (const s of STILL) {
  const div = document.createElement('div'), im = document.createElement('img');
  div.className = 'still'; im.alt = ''; im.src = `img/${s.img}.jpg`;
  div.appendChild(im); $('shade').before(div);
  await im.decode();
  s.layer = div; s.im = im;
}
await document.fonts.ready;
await Promise.all(['600 50px "Noto Serif SC"', '400 32px "Noto Serif SC"', '400 25px "Noto Sans SC"', '500 21px "Noto Sans SC"']
  .map(f => document.fonts.load(f, '云上潮汐馆冬至日落轴线展廊坡道月洞墙')));

function fadeWin(t, t0, t1, fin, fout) {
  if (t < t0 || t > t1) return 0;
  const a = fin > 0 ? smooth((t - t0) / fin) : 1, b = fout > 0 ? smooth((t1 - t) / fout) : 1;
  return Math.min(a, b);
}
function tideAt(t) {
  for (let i = 0; i < TIDE.length - 1; i++) {
    const [t0, z0] = TIDE[i], [t1, z1] = TIDE[i + 1];
    if (t >= t0 && t <= t1) return lerp(z0, z1, smooth((t - t0) / (t1 - t0)));
  }
  return 0;
}
function placeStill(s, t) {
  const im = s.im, ia = im.naturalWidth / im.naturalHeight, sa = W / H;
  const w = ia > sa ? H * ia : W, h = ia > sa ? H : W / ia;               // 铺满画面（宽幅图左右溢出，16:10 图上下各裁 5%）
  const k = smooth((t - (s.kbFrom ?? s.t0)) / (s.t1 - (s.kbFrom ?? s.t0)));
  const sc = lerp(s.kb[0], s.kb[1], k), x = lerp(s.kb[2], s.kb[3], k) * W;
  im.style.width = `${w}px`; im.style.height = `${h}px`;
  im.style.transform = `translate(calc(-50% + ${x.toFixed(2)}px), -50%) scale(${sc.toFixed(5)})`;
}
function frame(t) {
  // 渲染图
  let covered = false;
  for (const s of STILL) s.layer.style.opacity = 0;
  for (const s of STILL) {
    const o = fadeWin(t, s.t0, s.t1, s.fin ?? XF, s.fout ?? XF);
    if (o <= 0) continue;
    placeStill(s, t);
    s.layer.style.opacity = o.toFixed(4);
    if (o >= 0.999) covered = true;
  }
  // 三维
  const seg = FLY.find(f => t >= f.t0 && t <= f.t1);
  if (seg && !covered) {
    const { pos, tgt, h } = poseAt(seg, clamp(t, seg.move[0], seg.move[1]));
    camera.position.copy(pos);
    camera.fov = 2 * Math.atan(Math.tan(h * Math.PI / 360) * H / W) * 180 / Math.PI;   // 水平视角 → 竖直视角
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    camera.lookAt(tgt);
    water.position.y = tideAt(t) - 0.02;
    water.material.uniforms.time.value = t * 0.3;
    renderer.render(scene, camera);
  }
  // 字幕
  const c = CAPS.find(c => t >= c.t0 && t <= c.t1);
  const co = c ? fadeWin(t, c.t0, c.t1, 0.7, 0.6) : 0;
  if (c && $('cap').dataset.k !== c.k) {
    $('cap').dataset.k = c.k;
    $('cap').querySelector('.kicker').textContent = c.k;
    $('cap').querySelector('h2').textContent = c.h;
    $('cap').querySelector('.sub').textContent = c.s;
  }
  $('cap').style.opacity = co.toFixed(4);
  $('cap').style.transform = `translateY(${((1 - co) * 14).toFixed(2)}px)`;
  $('shade').style.opacity = (co * 0.95).toFixed(4);
  // 片头片尾
  for (const ti of TITLES) {
    const o = fadeWin(t, ti.t0, ti.t1, ti.fin, ti.fout);
    $(ti.el).style.opacity = o.toFixed(4);
    $(ti.el).style.transform = `scale(${(1.0 + (1 - o) * 0.015).toFixed(4)})`;
  }
  $('black').style.opacity = Math.max(1 - smooth(t / FADE_IN), smooth((t - (DURATION - FADE_OUT)) / FADE_OUT)).toFixed(4);
  return { fly: !!seg && !covered };
}

// 调试：某一时刻镜头四周（水平 16 个方向与上下）离最近实体的距离（m）
const ray = new THREE.Raycaster();
function clearance(t) {
  const seg = FLY.find(f => t >= f.t0 && t <= f.t1);
  if (!seg) return null;
  const { pos } = poseAt(seg, clamp(t, seg.move[0], seg.move[1]));
  let best = Infinity, dir = null;
  const dirs = [[0, 1, 0], [0, -1, 0]];
  for (let k = 0; k < 16; k++) dirs.push([Math.cos(k * Math.PI / 8), 0, Math.sin(k * Math.PI / 8)]);
  for (const d of dirs) {
    ray.set(pos, V(d)); ray.far = 3;
    const h = ray.intersectObjects(solid, false)[0];
    if (h && h.distance < best) { best = h.distance; dir = d; }
  }
  return { t, pos: pos.toArray().map(v => +v.toFixed(2)), min: best === Infinity ? null : +best.toFixed(2), dir };
}
window.film = { duration: DURATION, frame, clearance, pose: t => { const s = FLY.find(f => t >= f.t0 && t <= f.t1); return s ? poseAt(s, clamp(t, s.move[0], s.move[1])) : null; }, isReady: true };
</script>
